services:
  - type: web
    name: ping-mini-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        value: file:/app/.data/ping.sqlite
    disk:
      name: ping-data
      mountPath: /app/.data
      sizeGB: 1
